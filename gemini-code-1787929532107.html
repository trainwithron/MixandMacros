<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Macro Progression Portal</title>
  <style>
    :root { --primary: #1e293b; --accent: #2563eb; --bg: #f8fafc; --card: #ffffff; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--primary); padding: 24px; max-width: 680px; margin: auto; }
    .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h2, h3 { margin-top: 0; }
    label { display: block; font-weight: 600; margin: 12px 0 4px; font-size: 14px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    button { background: var(--accent); color: white; border: none; border-radius: 6px; padding: 12px 18px; font-weight: 600; cursor: pointer; margin-top: 16px; width: 100%; }
    button:hover { opacity: 0.9; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .results { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 16px; display: none; }
    .macro-badge { display: inline-block; padding: 6px 12px; background: white; border-radius: 6px; margin: 4px; font-weight: 700; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Client Check-In & Macro Progression</h2>
    
    <label>1. Load Previous Plan (.json)</label>
    <input type="file" id="fileInput" accept=".json" onchange="loadPlan(event)">

    <label>Current Phase</label>
    <select id="phase">
      <option value="fat_loss">Fat Loss (Cut)</option>
      <option value="maintenance">Maintenance</option>
      <option value="hypertrophy">Muscle Gain (Surplus)</option>
    </select>

    <div class="grid">
      <div>
        <label>Current Weight (lbs)</label>
        <input type="number" id="currentWeight" step="0.1" placeholder="e.g. 182.4">
      </div>
      <div>
        <label>Previous Weight (lbs)</label>
        <input type="number" id="prevWeight" step="0.1" placeholder="e.g. 183.8">
      </div>
    </div>

    <div class="grid">
      <div>
        <label>Current Daily Calories</label>
        <input type="number" id="currentCalories" placeholder="e.g. 2100">
      </div>
      <div>
        <label>Days Compliant (Past 7 Days)</label>
        <input type="number" id="adherence" min="0" max="7" value="7">
      </div>
    </div>

    <button onclick="calculateProgression()">Calculate Progression</button>
  </div>

  <div id="resultsCard" class="card results">
    <h3>Updated Macro Targets</h3>
    <p id="coachingRationale"></p>
    
    <div style="text-align: center; margin: 16px 0;">
      <div class="macro-badge" id="badgeCalories">Calories: --</div>
      <div class="macro-badge" id="badgeProtein">Protein: --g</div>
      <div class="macro-badge" id="badgeCarbs">Carbs: --g</div>
      <div class="macro-badge" id="badgeFats">Fats: --g</div>
    </div>

    <button onclick="exportUpdatedPlan()">Export Updated Plan (.json)</button>
  </div>

  <script>
    let activeData = {
      phase: "fat_loss",
      currentTargets: { calories: 2000, protein: 180, carbs: 180, fats: 60 },
      history: []
    };

    function loadPlan(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        activeData = JSON.parse(e.target.result);
        document.getElementById('phase').value = activeData.phase || 'fat_loss';
        document.getElementById('prevWeight').value = activeData.currentWeight || '';
        document.getElementById('currentCalories').value = activeData.currentTargets.calories || '';
      };
      reader.readAsText(file);
    }

    function calculateProgression() {
      const phase = document.getElementById('phase').value;
      const currentWeight = parseFloat(document.getElementById('currentWeight').value);
      const prevWeight = parseFloat(document.getElementById('prevWeight').value);
      const currentCalories = parseInt(document.getElementById('currentCalories').value, 10);
      const adherence = parseInt(document.getElementById('adherence').value, 10);

      if (!currentWeight || !prevWeight || !currentCalories) {
        alert("Please fill in all weight and calorie fields.");
        return;
      }

      let newCalories = currentCalories;
      let rationale = "";
      const deltaWeight = currentWeight - prevWeight;
      const pctChange = (deltaWeight / prevWeight) * 100;

      // Adherence Check
      if (adherence < 5) {
        rationale = `Adherence was ${adherence}/7 days. Targets remain unchanged to establish consistency before making metabolic adjustments.`;
      } else {
        // Progression Logic
        if (phase === "fat_loss") {
          if (pctChange > -0.3) {
            newCalories = Math.round(currentCalories * 0.92); // 8% drop
            rationale = `Weight loss stalled (${pctChange.toFixed(2)}% change). Decreased calories by 8% to re-accelerate fat loss.`;
          } else if (pctChange < -1.5) {
            newCalories = Math.round(currentCalories * 1.05); // 5% bump
            rationale = `Weight loss rate was too fast (${Math.abs(pctChange).toFixed(2)}% drop). Bumped calories by 5% to preserve lean mass.`;
          } else {
            rationale = `Weight loss rate is optimal (${Math.abs(pctChange).toFixed(2)}% drop). Calories held steady.`;
          }
        } else if (phase === "hypertrophy") {
          if (pctChange < 0.1) {
            newCalories = currentCalories + 125;
            rationale = `Surplus stalled (${pctChange.toFixed(2)}% change). Added 125 kcal to drive lean mass progression.`;
          } else if (pctChange > 0.6) {
            newCalories = currentCalories - 75;
            rationale = `Surplus progressing too rapidly (${pctChange.toFixed(2)}% gain). Trimmed 75 kcal to minimize fat gain.`;
          } else {
            rationale = `Gaining at the target surplus rate (${pctChange.toFixed(2)}% gain). Targets held steady.`;
          }
        } else {
          newCalories = currentCalories + (deltaWeight < -1 ? 100 : (deltaWeight > 1 ? -100 : 0));
          rationale = `Maintenance phase: adjusted to stabilize baseline weight fluctuations.`;
        }
      }

      // Macro Distribution: Protein @ 1g/lb, Fat @ 25% of calories, Remainder to Carbs
      const proteinGrams = Math.round(currentWeight * 1.0);
      const fatGrams = Math.max(45, Math.round((newCalories * 0.25) / 9));
      const carbGrams = Math.max(50, Math.round((newCalories - (proteinGrams * 4) - (fatGrams * 9)) / 4));
      const resolvedCalories = (proteinGrams * 4) + (carbGrams * 4) + (fatGrams * 9);

      activeData = {
        phase,
        currentWeight,
        currentTargets: { calories: resolvedCalories, protein: proteinGrams, carbs: carbGrams, fats: fatGrams },
        history: [...(activeData.history || []), { date: new Date().toISOString().split('T')[0], weight: currentWeight, calories: resolvedCalories }]
      };

      document.getElementById('coachingRationale').innerText = rationale;
      document.getElementById('badgeCalories').innerText = `Calories: ${resolvedCalories}`;
      document.getElementById('badgeProtein').innerText = `Protein: ${proteinGrams}g`;
      document.getElementById('badgeCarbs').innerText = `Carbs: ${carbGrams}g`;
      document.getElementById('badgeFats').innerText = `Fats: ${fatGrams}g`;
      document.getElementById('resultsCard').style.display = 'block';
    }

    function exportUpdatedPlan() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(activeData, null, 2));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", `macro_plan_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(dlAnchor);
      dlAnchor.click();
      dlAnchor.remove();
    }
  </script>
</body>
</html>
